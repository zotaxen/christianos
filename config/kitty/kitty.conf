mkdir -p ~/.config/kitty
cat > ~/.config/kitty/kitty.conf << 'EOF'
# Schrift
font_family      JetBrainsMono Nerd Font
font_size        12

# Fenster
background_opacity    0.85
window_padding_width  12
confirm_os_window_close 0
enable_audio_bell no

# Cursor
cursor_shape beam
cursor_blink_interval 0.5

# ChristianOS Farben
background            #1e1e2e
foreground            #e0def4
cursor                #ff79c6
selection_foreground  #ffffff
url_color             #ff79c6

# Backgroundpicture
# background_image        ~/Pictures/wallpaper/Terminal2.jpg
# background_image_layout cscaled
background_tint         0.6

# Farbpalette (0-7 normal, 8-15 hell)
color0  #181825
color8  #45475a
color1  #b4637a
color9  #eb6f92
color2  #8bd5a0
color10 #a6e3a1
color3  #f6c177
color11 #f9e2af
color4  #7d6b9e
color12 #c4a7e7
color5  #9b59b6
color13 #ff79c6
color6  #8ec5d6
color14 #9ccfd8
color7  #e0def4
color15 #ffffff
EOF
